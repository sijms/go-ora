name: PR check

on:
  pull_request:

permissions:
  contents: read
  # golangci-lint's only-new-issues reads the pull request diff
  pull-requests: read

jobs:
  test:
    name: basic check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.19.x','1.20.x' ]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: check format
        run: go fmt ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test

  # v2 and v3 are separate modules, so the root "go test" above never builds
  # their tests. TestIssues has its own go.mod and needs a live database, so
  # "./..." here leaves it out.
  module-tests:
    name: ${{ matrix.module }} unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: v2
            go-version: '1.20.x'
          - module: v3
            go-version: '1.24.x'
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  # https://github.com/golangci/golangci-lint-action
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20.x'

      - uses: actions/checkout@v3

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          only-new-issues: true

